<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <style>
body {
    font-family: sans-serif;
    color: #B34507;
}
.passwordLength{
    text-align: center;
}
#passwordLength {
    -webkit-appearance: none;
    appearance: none;
    width: 70%;
    height: 6px;
    background-color: rgba(255, 0, 0, .3);
    border: 0;
    border-radius: 4px;
}
#passwordLength:hover {
    background-color: rgba(139, 1, 1, .3)
}
#passwordLength::-webkit-slider-thumb {
    height: 20px;
    width:  20px;
    border: 0px;
    border-radius:50%;
    appearance: none;
    -webkit-appearance: none;
    background-color: red;
}
#passwordLength::-webkit-slider-thumb:hover #passwordLength {
    background-color: rgba(139, 1, 1, .3);
} 
#upnlow {
    padding-left: 20px;
}
label {
    display: inline-block;
    padding-left: 24px;
    position: relative;
    margin-bottom: 10px;
    margin-right: 5px;
    cursor: pointer;
    user-select: none;
}
label input {
    position: absolute;
    cursor: pointer;
    visibility: hidden;
}
label span {
    position: absolute;
    top: 0;
    left: 0;
    height: 16px;
    width: 16px;
    background-color: red;
    border: 1px solid gray;
    border-radius: 50%;
}
label:hover span {
    background: darkred;
}
label input:checked ~ span::after {
    content: "";
    position: absolute;
    display: block;
    top: 2px;
    left: 4px;
    height: 7px;
    width: 4px;
    border: solid #fff;
    border-width: 0 3px 3px 0;
    transform: rotate(45deg);
}
#password {
    background-color: #ececec;
	color: darkcyan;
	border: 2px solid red;
	border-radius: 20px;
	border-top-right-radius: 0px;
	border-bottom-right-radius: 0px;
	padding: 5px 10px;
	font-size: 16px;
	margin-right: 0px;
}
#password:hover {
    border-color: darkred;
}
#password::selection{
    background: red;
    color: #fff;
}
button {
	background-color: #ff0000;
	border: 2px solid red;
	border-radius: 50px;
	color: #ffffff;
	padding: 5px 10px;
	font-size: 16px;
	cursor: pointer;
}
button:hover {
    background-color: darkred;
    border-color: darkred;
}
.generate {
    text-align: center;
    color: #ff0000;
    position: relative;
    display: block;
}
.copy {
	color: #ff0000;
	position: relative;
	display: inline-block;
}
.tooltip {
	visibility: hidden;
	width: 160px;
	background-color: rgba(30,30,30, .6);
	border-radius: 20px;
	color: #fff;
	text-align: center;
	padding: 5px 0;
	position: absolute;
	z-index: 1;
	bottom: 150%;
	left: 50%;
	margin-left: -80px;
	opacity: 0;
	transition: opacity .3s;
}
.copy:hover #tooltipC {
	visibility: visible;
	opacity: 1;
}
.generate:hover #tooltipG {
    visibility: visible;
    opacity: 1;
}
.tooltip::after {
	opacity: .6;
	content: "";
	position: absolute;
	top: 100%;
	left: 50%;
	margin-left: -5px;
	border-width: 5px;
	border-style: solid;
	border-color: rgb(30,30,30) transparent transparent transparent;
}
.copy button{
	border-top-left-radius: 0px;
	border-bottom-left-radius: 0px;

<body onload="inputs()">
    <form>
        <div class="passwordLength">password length: <b id="passwordLengthOutput">10</b><br><input id="passwordLength" type="range" value="10" min="4" max="100" onfocus="this.blur();" oninput="ploninput();"></div><br>
        <label><input id="alphabet" type="checkbox" checked onclick="upnlowdiv2()">Include Alphabet<span></span></label>
        <br>
        <div id="upnlow">
            <label><input id="uppercase" type="checkbox" checked onclick="upnlowdiv1()">Uppercase (ABC...)<span></span></label>
            <label><input id="lowercase" type="checkbox" checked onclick="upnlowdiv1()">Lowercase (abc...)<span></span></label>
        </div>
        <label>Include Numbers (123...)<input id="numbers" type="checkbox" checked="checked"><span></span></label>
        <br>
        <label><input id="symbols" type="checkbox" checked>Include symbols (@#$...)<span></span></label>
        <br>
        <label><input id="smchar" type="checkbox" checked>Exclude similar characters (il1Lo0O-_)<span></span></label>
        <br>
        <label><input id="achar" type="checkbox">Exclude  Ambiguous Characters: ((){}[]/\"'~=,;:.<>^)<span></span></label>
    </form>
    <div class="generate">
    <button onclick="generator()" onmouseout="mouseout()" onfocus="this.blur()">Generate</button>
    <span class="tooltip" id="tooltipG">generate password</span>
    </div>
    <br>
    <input id="password" placeholder="password" disabled="disabled">
    <div class="copy">
    <button id="copybutton" onclick="copy();" onmouseout="mouseout();" onfocus="this.blur()">Copy</button>
    <span class="tooltip" id="tooltipC">opy to clipboard</span>
    </div>
    <script>
function inputs(){
  passwordLength = document.getElementById("passwordLength");

  passwordLengthOutput = document.getElementById("passwordLengthOutput");
  alphaCheck = document.getElementById("alphabet");
  upCheck = document.getElementById("uppercase");
  lowCheck = document.getElementById("lowercase");
  upnlow = document.getElementById("upnlow");
  numCheck = document.getElementById("numbers");
  symCheck = document.getElementById("symbols");
  smcharCheck = document.getElementById("smchar");
  acharCheck = document.getElementById("achar");
  pass = document.getElementById("password");
  tooltipG = document.getElementById("tooltipG");
  tooltipC = document.getElementById("tooltipC");
}
function ploninput(){
  passwordLengthOutput.innerHTML = passwordLength.value;
}
function upnlowdiv1 (){
  if (upCheck.checked == false & lowCheck.checked == false) {
    upnlow.style.display = "none";
    alphaCheck.checked = false;
  }
}
function upnlowdiv2 (){
  if (alphaCheck.checked == true) {
    upnlow.style.display = "block";
    upCheck.checked = true;
    lowCheck.checked = true;
  }
  else{
    upnlow.style.display = "none";
    upCheck.checked = false;
    lowCheck.checked= false; 
  }
}
var uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
lowercase = "abcdefghijklmnopqrstuvwxyz",
numbers = "0123456789",
symbols = "@#$_&-+()/*'\":;!?~^={}\\%[]", 
smchar = ("-_1iIlLoO0").split(""), 
achar = ("(){}[]/\\\"'~=,;:.<>^").split("");
function randomInt(max){
  return (Math.floor(Math.random() * max));
}
function generator(){
    if(alphaCheck.checked == true || numCheck.checked == true || symCheck.checked == true){
    var password = "";
    var keywords = [];
   if (upCheck.checked == true) {
      keywords.push(uppercase);
    }
   if (lowCheck.checked == true) {
     keywords.push(lowercase);
    }
    if (numCheck.checked == true) {
      keywords.push(numbers);
   }
    if (symCheck.checked == true) {
      keywords.push(symbols);
    }
    do{
    index1 = randomInt(keywords.length);
    index2 = randomInt(keywords[index1].length);
    var i = keywords[index1][index2];
    if ((smcharCheck.checked == true && smchar.indexOf(i) != (-1)) || (acharCheck.checked == true && achar.indexOf(i) != (-1))) {
        continue;
    }
    password = password + i;
    } while (password.length < passwordLength.value);
    pass.value = password;
    tooltipG.innerHTML = ("password generated");
    }
    else{tooltipG.innerHTML = ("please include something");}
}
function copy(){
if (pass.value == ""){
    tooltipC.innerHTML = ("please generate password first");
    } else {
  	pass.removeAttribute("disabled");
    pass.select(); 
    pass.setSelectionRange(0, pass.value.length);
    document.execCommand("copy");
    pass.disabled = "disabled";
    tooltipC.innerHTML = ("copied to clipboard");
  }
}
function mouseout(){
	tooltipC.innerHTML = ("copy to clipboard");
	tooltipG.innerHTML = ("generate password");
}
    </script>
